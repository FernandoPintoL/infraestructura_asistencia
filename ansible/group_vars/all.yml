# Variables para todas las instancias de todos los tenants.

# Conexión por SSM Session Manager: no se abre el puerto 22 ni se necesitan llaves SSH.
# Las instancias ya tienen el rol AmazonSSMManagedInstanceCore (lo pone Terraform).
ansible_connection: community.aws.aws_ssm
ansible_aws_ssm_region: "{{ lookup('ansible.builtin.env', 'AWS_REGION', default='us-east-1') }}"
# El plugin transfiere archivos por S3 con URLs firmadas: se usa el bucket de respaldos
# (salida "bucket_respaldos" del bootstrap). export IAC_BUCKET_RESPALDOS=asistencia-respaldos-<cuenta>
ansible_aws_ssm_bucket_name: "{{ lookup('ansible.builtin.env', 'IAC_BUCKET_RESPALDOS') }}"
ansible_python_interpreter: /usr/bin/python3

zona_horaria: America/La_Paz
