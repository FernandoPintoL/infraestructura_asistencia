# Configuración POSTERIOR de las instancias de los tenants (después de cloud-init).
# Idempotente: se puede ejecutar cuantas veces se quiera; solo cambia lo que falte.
#
#   ansible-playbook configurar.yml                        # toda la flota
#   ansible-playbook configurar.yml -l tenant_colegio_demo # un tenant
#   ansible-playbook configurar.yml --check --diff         # ver qué cambiaría, sin cambiar nada
#
# Tras un cambio de plan (instancia más grande), volver a ejecutarlo ajusta PostgreSQL
# a la memoria nueva.

- name: Base común de las 3 instancias
  hosts: all
  become: true

  tasks:
    - name: Zona horaria {{ zona_horaria }}
      ansible.builtin.shell: |
        if [ "$(timedatectl show -p Timezone --value)" != "{{ zona_horaria }}" ]; then
          timedatectl set-timezone "{{ zona_horaria }}" && echo CAMBIADA
        fi
      register: zona
      changed_when: "'CAMBIADA' in zona.stdout"

    - name: Paquetes de seguridad y métricas (ya vienen en la AMI de Packer)
      ansible.builtin.apt:
        name: [unattended-upgrades, prometheus-node-exporter]
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: Parches de seguridad automáticos
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: SSH sin contraseñas ni root
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/50-asistencia.conf
        mode: "0644"
        content: |
          PasswordAuthentication no
          PermitRootLogin no
        validate: /usr/sbin/sshd -t -f %s
      notify: Reiniciar ssh

    - name: Límite de los registros del sistema (journald)
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/asistencia.conf
        mode: "0644"
        content: |
          [Journal]
          SystemMaxUse=200M
      notify: Reiniciar journald

    - name: Exportador de métricas encendido (lo consulta Prometheus/Grafana)
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        state: started
        enabled: true

    - name: Memoria de intercambio de 1 GB (si no hay)
      ansible.builtin.shell: |
        fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
      when: ansible_swaptotal_mb == 0

    - name: Intercambio permanente
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0

  handlers:
    - name: Reiniciar ssh
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted

    - name: Reiniciar journald
      ansible.builtin.systemd_service:
        name: systemd-journald
        state: restarted


- name: Nginx (frontend y backend) con cabeceras de seguridad
  hosts: servicio_frontend:servicio_backend
  become: true

  tasks:
    - name: Cabeceras de seguridad y sin versión de Nginx a la vista
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/seguridad.conf
        mode: "0644"
        content: |
          server_tokens off;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      notify: Probar y recargar nginx

  handlers:
    - name: Probar y recargar nginx
      ansible.builtin.shell: nginx -t && systemctl reload nginx


- name: PostgreSQL ajustado al tamaño de la instancia (depende del plan)
  hosts: servicio_db
  become: true

  tasks:
    - name: Carpeta de configuración de PostgreSQL
      ansible.builtin.shell: ls -d /etc/postgresql/*/main/conf.d | head -n 1
      register: conf_d
      changed_when: false

    - name: Memoria según la instancia ({{ ansible_memtotal_mb }} MB)
      ansible.builtin.copy:
        dest: "{{ conf_d.stdout }}/asistencia.conf"
        mode: "0644"
        content: |
          # Generado por Ansible (configurar.yml) para una instancia de {{ ansible_memtotal_mb }} MB
          shared_buffers = {{ (ansible_memtotal_mb * 0.25) | int }}MB
          effective_cache_size = {{ (ansible_memtotal_mb * 0.5) | int }}MB
          maintenance_work_mem = {{ [(ansible_memtotal_mb * 0.05) | int, 32] | max }}MB
          work_mem = 4MB
          log_min_duration_statement = 500
      notify: Reiniciar PostgreSQL

  handlers:
    - name: Reiniciar PostgreSQL
      ansible.builtin.systemd_service:
        name: postgresql
        state: restarted
