# Servidor de monitoreo: Prometheus + Blackbox exporter + Grafana.
# Red del host: Prometheus llega directo a las IPs privadas de los tenants y al rol de la
# instancia (descubrimiento EC2). Solo Grafana (3000) queda abierto, y el security group
# lo limita a las IPs de administración.
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-datos:/prometheus

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    network_mode: host
    restart: unless-stopped
    env_file: .env   # GF_SECURITY_ADMIN_PASSWORD (se lee de SSM al arrancar)
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: America/La_Paz
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-datos:/var/lib/grafana

volumes:
  prometheus-datos: {}
  grafana-datos: {}
